# Aesthetics — HubSpot field mappings
# owner: Nick Olsen
# source: live read of portal 278427, form "USA - AES - Accelerate Nashville 2026"
# validated: 2026-09-06
#
# Internal property names, read from the live form definition. Not display labels.
# Shared configuration procedure: ../../../.agents/skills/lumenis-accelerate-campaign/references/forms.md

division_code: AES
portal: 278427

# Routing — these decide the Salesforce destination. Verified values only.
routing:
  imported_record_type__c:
    value: Aesthetics                      # NOT "AES"
    allowed: [Ophthalmic, Aesthetics, Service, Beauty]
    status: source-reported-2026-09-06
  goes_to_sf_:
    value: Sync                            # NOT "Yes" — there is no Yes value
    allowed: [Sync, "Not Sync"]
    status: source-reported-2026-09-06

properties:
  firstname:            {type: text,        required: true}
  lastname:             {type: text,        required: true}
  company:              {type: text,        required: true, form_label: Practice Name}   # identical on Vision
  jobtitle:             {type: text,        required: true}
  email:                {type: text,        required: true}
  phone:                {type: phonenumber, required: true}
  city:                 {type: text,        required: false}
  state:                {type: select,      required: false}
  zip:                  {type: text,        required: true}
  country:              {type: select,      required: true}
  aesthetic_position:
    type: select
    required: true          # REQUIRED. Live form still has it optional — D30.
    allowed: ["Plastic Surgeon", "Dermatologist", "MedSpa", "Physician",
              "Aesthetic Practice Owner", "Nurse", "Administrator",
              "Clinical Leader", "Laser Practitioner",
              "Tattoo Removal Professional", "Cosmetician/Beautician",
              "Fellow", "Other", "Patient"]

utm:                    # hidden, plain text, populated from the URL
  [utm_campaign, utm_content, utm_medium, utm_source, utm_term]

# STILL BLOCKED — D07. Consent is never inferred and never defaulted to opt-in.
# The reference form carries no subscription field; that does not mean opt-in.
subscriptions: {}

# Not yet read from Salesforce.
record_types: {}

source_observation:
  recorded_date: 2026-09-06
  independently_verified_this_release: false
  donor_aesthetic_position_required: false
  donor_utm_fields_present: true

release_requirements:
  confirm_current_portal_schema: true
  confirm_consent_and_subscription: true
  confirm_owner_acceptance_of_target_changes: true
