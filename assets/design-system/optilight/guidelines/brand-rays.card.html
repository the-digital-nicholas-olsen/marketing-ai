<!-- @dsCard group="OptiLIGHT" viewport="700x280" name="Rays" subtitle="The signature graphic system — the brand's biggest missing guideline until now" -->
<link rel="stylesheet" href="../../styles.css" />
<div
  style="
    position: relative;
    width: 700px;
    height: 280px;
    overflow: hidden;
    background: var(--lum-black);
  "
>
  <div
    style="
      position: absolute;
      inset: 0;
      background-image: url(../../../assets/photography/nature-sky.webp);
      background-size: cover;
      background-position: center;
    "
  ></div>
  <div
    style="
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.45), transparent 42%);
    "
  ></div>
  <svg
    style="position: absolute; inset: 0; width: 100%; height: 100%"
    viewBox="0 0 1200 700"
    preserveAspectRatio="none"
    aria-hidden="true"
  >
    <polygon
      points="1320,860 520,-120 800,-120"
      fill="var(--lum-blue)"
      opacity="0.9"
    ></polygon>
    <g stroke="var(--lum-white)" stroke-width="4" fill="none">
      <line x1="1320" y1="860" x2="240" y2="-120"></line>
      <line x1="1320" y1="860" x2="520" y2="-120"></line>
      <line x1="1320" y1="860" x2="800" y2="-120"></line>
      <line x1="1320" y1="860" x2="1080" y2="-120"></line>
    </g>
  </svg>
  <div style="position: absolute; left: 28px; bottom: 20px">
    <div
      style="
        font-family: var(--font-sans);
        font-size: var(--text-caption);
        letter-spacing: var(--tracking-caption);
        text-transform: uppercase;
        color: var(--lum-white);
      "
    >
      Rays of light — the signature system
    </div>
    <div
      style="
        font-family: var(--font-sans);
        font-size: var(--text-caption);
        color: rgba(255, 255, 255, 0.85);
        margin-top: 5px;
        max-width: 380px;
        line-height: 1.45;
      "
    >
      4px white strokes from one shared origin, anchored to one side of the
      format so they never cross the text — the wedge between two rays fills
      with OptiLIGHT Blue or an image.
    </div>
  </div>
</div>
