<!-- @dsCard group="UI Kit — Slides" viewport="1440x900" name="16:9 Slides" subtitle="Slide grid, fixed frame, type scale, color pairings, rules and six full-bleed slide types, based on the 2027 Aesthetics AOP" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Lumenis — slides</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script src="../../_ds_bundle.js"></script>
<style>
body{background:var(--neutral-200)}
.page{padding:48px;display:flex;flex-direction:column;gap:56px}
.band h2{font-size:14px;text-transform:uppercase;margin-bottom:6px}
.band p{font-size:14px;color:var(--text-secondary);margin-bottom:20px;max-width:820px}
.band h3{font-size:12px;text-transform:uppercase;margin:32px 0 12px;color:var(--text-secondary)}
.row{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start}
.fill{width:100%;height:100%;object-fit:cover;display:block}
.specs{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px 40px;max-width:1400px}
.spec{border-collapse:collapse;width:100%;font-size:13px;line-height:1.35}
.spec th,.spec td{text-align:left;vertical-align:top;padding:7px 0;border-top:1px solid var(--neutral-300)}
.spec th{width:34%;font-weight:400;color:var(--text-secondary);padding-right:16px}
.sw{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-right:6px}
.rules{font-size:13px;line-height:1.45;max-width:1400px;columns:2 440px;column-gap:40px;padding-left:18px}
.rules li{margin-bottom:6px;break-inside:avoid}
.slide-cap{font-size:12px;color:var(--text-secondary);margin-top:8px;max-width:768px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Logo } = window.LumenisCorporateDesignSystem;

/* Photos: Lumenis brand stock photography, hosted in HubSpot
   (Aesthetic - EMEA (DAM) / Marketing Assets / Visuals / Brand Visuals / Stock Images / Models).
   hs-fs serves a resized copy; the originals are 4,000–9,700 px. */
const PHOTO = (n,w=1920) => `https://information.lumenis.com/hs-fs/hubfs/Aesthetic%20-%20EMEA%20(DAM)/Marketing%20Assets/Visuals/Brand%20Visuals/Stock%20Images/Models/Lumenis_Brand%20Stock%20Photography_Models_JPEG%20(${n}).jpg?width=${w}`;
const photo = (n,pos='50% 50%',alt='') => <img className="fill" src={PHOTO(n)} alt={alt} style={{objectPosition:pos}}/>;

/* ── 16:9 slide format ─────────────────────────────────────────────
   Every number is a slide value (1920×1080 canvas). Slides never invent
   their own sizes. Base point: the 2027 Aesthetics AOP. */
const SL = {
  W:1920, H:1080, M:128,                 // canvas, side margins
  col:973, gap:86,                       // text column (61.8% of the 1664 content width); gap to a bleed photo
  bleedA:1187, bleedB:733,               // 61.8 / 38.2 of the full width: photos and color blocks bleed at these widths
  tracker:52, title:149,                 // fixed frame, from the top edge
  titleGap:34,                           // title to content, always
  bottom:952,                            // content bottom
  foot:55,                               // footer offset from the bottom (the so-what line ends at `bottom`)
  logo:89,                               // footer wordmark width (about 18 tall)
};
/* Text sits in one 973 column: on the left (x 128–1101) beside a right-hand photo,
   or on the right (x 819–1792) beside a left-hand photo. */
const LEFT  = {x:SL.M, w:SL.col};
const RIGHT = {x:SL.bleedB+SL.gap, w:SL.col};
const SP = [8,13,21,34,55,89,144];       // the only spacing steps
/* Proximity: space shows what belongs together. Three levels, never mixed up:
   tight   8  a point and its supporting line
   near   13  a label and the text it labels; a number and its label
   follow 21  a display line and the serif line that completes it
   apart  34  between groups (and title to content)
   section 55  between the serif lead line and the body it introduces */
const G = {tight:SP[0], near:SP[1], follow:SP[2], apart:SP[3], section:SP[4]};
const T = { label:18, body:28, lead:36, number:56, display:88, hero:136, chapter:220,
            tracker:15, title:54, foot:14 };
const INK='#231f20', SECONDARY='#575757', WHITE='#ffffff';

/* Color pairings: the acceptable field + ink combinations (from the Accelerate color band).
   A deck chooses one pairing per chapter; the field color carries large shapes (chapter number,
   tracker dash, color field), the ink color carries small colored type and the so-what arrow.
   Never split a pairing, and never put field-color type on white below 56px. */
const PAIRS = {
  mint:      {name:'Mint',       field:'#6cc39b', ink:'#2f8a68'},
  sky:       {name:'Sky',        field:'#7bc9ed', ink:'#316faf'},
  roseGold:  {name:'Rose Gold',  field:'#fabcad', ink:'#ba6d81'},
  lavender:  {name:'Lavender',   field:'#b5a7d1', ink:'#7079ba'},
  silkenRose:{name:'Silken Rose',field:'#ba6d81', ink:'#8f4d61'},
};
const BOOKEND = {name:'Purple', field:'#7079ba', ink:WHITE};   // opening and closing color block, white type
/* Example deck only: the chapter sequence these sample slides use. Each deck sets its own. */
const DECK = [
  {name:'Chapter 1', pair:PAIRS.mint},
  {name:'Chapter 2', pair:PAIRS.sky},
  {name:'Chapter 3', pair:PAIRS.roseGold},
  {name:'Chapter 4', pair:PAIRS.lavender},
  {name:'Finale',    pair:PAIRS.silkenRose},
];

const SANS="'ABC Arizona Sans', Arial, sans-serif", LIGHT="'ABC Arizona Sans Light', Arial, sans-serif", MIX="'ABC Arizona Mix', Georgia, serif";
const abs=(s)=>({position:'absolute',...s});
/* Leading is set tight enough that a wrapped line reads as one block, never as two paragraphs. */
const label=(c=SECONDARY)=>({fontFamily:SANS,fontSize:T.label,lineHeight:1.2,letterSpacing:3.5,textTransform:'uppercase',color:c,margin:0});
const display=(c=INK,size=T.display)=>({fontFamily:SANS,fontSize:size,fontWeight:400,lineHeight:.95,textTransform:'uppercase',color:c,margin:0});
const lead=(c=INK)=>({fontFamily:MIX,fontSize:T.lead,lineHeight:1.18,color:c,margin:0});
const body=(c=SECONDARY)=>({fontFamily:SANS,fontSize:T.body,lineHeight:1.32,color:c,margin:0});
const Group=({gap=G.tight,children,style})=>(<div style={{display:'flex',flexDirection:'column',gap,...style}}>{children}</div>);
const big=(size,c=INK)=>({fontFamily:LIGHT,fontSize:size,lineHeight:.85,letterSpacing:size>=T.hero?-6:-1,color:c,margin:0});

function Slide({children,scale=0.4}){
  return (
    <div style={{width:SL.W*scale,height:SL.H*scale,overflow:'hidden',boxShadow:'0 10px 30px rgba(0,0,0,.12)',flex:'none'}}>
      <div style={{width:SL.W,height:SL.H,transform:`scale(${scale})`,transformOrigin:'0 0',background:WHITE,position:'relative',color:INK,fontFamily:SANS}}>{children}</div>
    </div>
  );
}
/* Tracker: chapter name in dark grey, then one dash per chapter in its field color; current one long. */
function Tracker({at,chapter}){
  return (
    <div style={abs({left:at.x,top:SL.tracker,display:'flex',alignItems:'center',gap:18})}>
      <span style={{...label(SECONDARY),fontSize:T.tracker,letterSpacing:3,lineHeight:1}}>{DECK[chapter].name}</span>
      <span style={{display:'flex',gap:5}}>{DECK.map((c,i)=><span key={i} style={{width:i===chapter?28:12,height:4,borderRadius:2,background:c.pair.field}}/>)}</span>
    </div>
  );
}
/* Title and content stack in one column, so the title-to-content gap is always 34. */
function Column({at,title,top=SL.title,gap=SL.titleGap,children}){
  return (
    <div style={abs({left:at.x,top,width:at.w,display:'flex',flexDirection:'column',gap})}>
      {title && <h2 style={{...display(INK,T.title),lineHeight:1.05}}>{title}</h2>}
      {children}
    </div>
  );
}
/* Footer: a small black wordmark, the source note and the page number on one line, 55 from the
   bottom, on the text side only, so it never sits on a photo. The wordmark leads, left-justified
   to the text column. */
function Footer({at,source,page}){
  return (
    <div style={abs({left:at.x,width:at.w,bottom:SL.foot,display:'flex',alignItems:'flex-end',gap:SP[4],fontFamily:SANS,fontSize:T.foot,lineHeight:1,color:SECONDARY})}>
      <span style={{flex:'none',paddingBottom:1}}><Logo width={`${SL.logo}px`}/></span>
      <span style={{flex:1}}>{source}</span>
      <span style={{flex:'none',letterSpacing:1}}>{page}</span>
    </div>
  );
}
/* "So what": the line a content slide ends on. Arrow in the chapter ink, one sentence in serif.
   Pinned by its bottom edge to the content bottom (952), so a second line grows upward and the
   space above the footer never changes. */
function SoWhat({at,chapter,children}){
  return (
    <div style={abs({left:at.x,bottom:SL.H-SL.bottom,width:at.w,display:'flex',gap:SP[2],alignItems:'baseline'})}>
      <span style={{...lead(DECK[chapter].pair.ink),lineHeight:1}}>→</span>
      <p style={{...lead(INK),flex:1}}>{children}</p>
    </div>
  );
}
const Stat=({n,l})=>(<Group gap={G.near}><p style={big(T.number)}>{n}</p><p style={label()}>{l}</p></Group>);
function Spec({rows}){
  return <table className="spec"><tbody>{rows.map(([k,v],i)=><tr key={i}><th>{k}</th><td>{v}</td></tr>)}</tbody></table>;
}

function App(){
  return (
    <div className="page">
      <section className="band">
        <h2>Presentation · 16:9 · 1920 × 1080</h2>
        <p>Based on the 2027 Aesthetics AOP. One idea per slide on a white ground, photography that bleeds to the edge, and nothing else: no lines, no boxes, no repeated labels. Every slide uses the same grid, frame and type sizes, so the eye never has to re-learn a page. Proportions follow the golden ratio (61.8 / 38.2); spacing uses Fibonacci steps only.</p>

        <h3>Grid and fixed frame</h3>
        <Slide scale={2/3}>
          <div style={abs({left:0,top:0,width:SL.M,height:SL.H,background:'rgba(186,109,129,.10)'})}/>
          <div style={abs({left:LEFT.x,top:SL.title,width:SL.col,height:SL.bottom-SL.title,background:'rgba(97,195,217,.12)',outline:'1px dashed #61c3d9'})}/>
          <div style={abs({left:SL.bleedA,top:0,width:SL.bleedB,height:SL.H,background:'rgba(250,188,173,.35)',outline:'1px dashed #ba6d81'})}/>
          {[[SL.tracker,'52 · tracker'],[SL.title,'149 · title 54'],[SL.title+57+SL.titleGap,'title + 34 · content'],[SL.bottom,'952 · content and so-what line end'],[SL.H-SL.foot,'1025 · footer, 55 from the bottom']].map(([y,l])=>(
            <div key={y} style={abs({left:0,width:SL.bleedA,top:y,borderTop:'1px solid rgba(35,31,32,.35)'})}>
              <span style={{position:'absolute',right:SP[2],top:(y>900&&y<1000)?-30:4,fontSize:22,color:SECONDARY}}>{l}</span>
            </div>
          ))}
          <div style={abs({left:LEFT.x+SP[2],top:560,fontSize:30,color:'#316faf'})}>Text column · 973 (61.8%)</div>
          <div style={abs({left:LEFT.x+SL.col+4,top:620,fontSize:22,color:SECONDARY})}>86</div>
          <div style={abs({left:SL.bleedA+SP[4],top:500,width:SL.bleedB-2*SP[4],fontSize:30,color:'#8f4d61'})}>Full-bleed photo · 733 (38.2%). Mirror it to the left and the text column moves to x 819.</div>
          <div style={abs({left:16,top:520,fontSize:22,color:'#8f4d61'})}>128</div>
          <Tracker at={LEFT} chapter={1}/>
          <Column at={LEFT} title="Slide title · 54px caps at 149"/>
          <Footer at={LEFT} source="Source note · 14px" page="00"/>
        </Slide>

        <div className="specs" style={{marginTop:24}}>
          <Spec rows={[
            ['Canvas','1920 × 1080 (16:9), white ground'],
            ['Text column','973 wide: x 128–1101 beside a right-hand photo, x 819–1792 beside a left-hand photo'],
            ['Photo or color block','Always full bleed, top to bottom and to the edge: 733 (38.2%) beside the text column, or 1187 (61.8%) on the bookends'],
            ['Spacing steps','8 · 13 · 21 · 34 · 55 · 89 · 144 only'],
            ['Title to content','34, always: the title and content stack in one column'],
            ['Proximity','8 between a point and its supporting line; 13 between a label and its text, or a number and its label; 21 between a display line and the serif line that completes it; 34 between groups; 55 between a serif lead line and the body under it'],
            ['Bookend inset','89 from the block edges for the wordmark and the headline'],
          ]}/>
          <Spec rows={[
            ['Tracker','Top 52, on the text column. Chapter name 15px caps in dark grey, then one dash per chapter in its field color (current 28 long, others 12). No section name: the title says it.'],
            ['Title','54px caps at 149, Arizona Sans, one or two lines. No eyebrow above it.'],
            ['So-what line','Ends at 952, the content bottom, on the text column; a second line grows upward, so the space above the footer stays the same. Arrow in the chapter ink, then one sentence in Arizona Mix at 36'],
            ['Footer','One line, 55 from the bottom, spanning the text column: small wordmark, then the source note, then the page number at the column’s right edge. Text 14px in dark grey #575757'],
            ['Logo','Content slides: black wordmark 89 wide, left-justified in the footer on the text side, never on a photo or text. Bookends: white wordmark 210 wide on the color block'],
          ]}/>
          <Spec rows={[
            ['Label','18 · caps · 3.5px tracking · dark grey'],
            ['Body','28 · Arizona Sans · dark grey'],
            ['Lead, quote, so-what','36 · Arizona Mix · ink #231F20'],
            ['Number','56 · Arizona Sans Light'],
            ['Display (bookends, chapter, name)','88 · caps · Arizona Sans'],
            ['Hero number','136 · Arizona Sans Light; chapter numbers and single hero figures may go to 220'],
            ['Ink and secondary','Ink #231F20 for titles, leads and numbers; dark grey #575757 for everything secondary. Never pure black.'],
          ]}/>
        </div>

        <h3>Color pairings</h3>
        <p>Use these pairs as a set: the field color for large shapes, the ink color for small colored type. A deck picks one pair per chapter, in any order, and keeps it for the whole chapter. Purple with white type is reserved for the opening and closing.</p>
        <div className="specs">
          <Spec rows={Object.values(PAIRS).map(p=>[p.name,<span><span className="sw" style={{background:p.field}}/>{p.field} field <span className="sw" style={{background:p.ink,marginLeft:14}}/>{p.ink} ink</span>]).concat([[BOOKEND.name,<span><span className="sw" style={{background:BOOKEND.field}}/>{BOOKEND.field} block with white type · bookends only</span>]])}/>
        </div>

        <h3>Slide types</h3>
        <div className="row">
          {/* 1 · Opening */}
          <div><Slide>
            <div style={abs({left:0,top:0,width:SL.bleedA,height:SL.H,overflow:'hidden'})}>{photo(61,'40% 30%','A woman laughing, hands at her cheeks')}</div>
            <div style={abs({left:SL.bleedA,top:0,width:SL.bleedB,height:SL.H,background:BOOKEND.field})}>
              <div style={abs({left:SP[5],top:SP[5]})}><Logo tone="white" width="210px"/></div>
              <Group gap={G.apart} style={abs({left:SP[5],right:SP[5],bottom:SP[5]})}>
                <Group gap={G.near}>
                  <p style={label(WHITE)}>2027 · North America Aesthetics</p>
                  <h1 style={display(WHITE)}>Their best year yet</h1>
                </Group>
                <p style={label(WHITE)}>Month day, year</p>
              </Group>
            </div>
          </Slide><div className="slide-cap">Opening · photo full bleed at 61.8%; purple block at 38.2% with the white wordmark, a label, the promise in four words at 88 and the date. Photo: brand stock 61.</div></div>

          {/* 2 · Chapter break */}
          <div><Slide>
            <Tracker at={LEFT} chapter={1}/>
            <Group gap={G.apart} style={abs({left:LEFT.x,top:SL.title,width:LEFT.w,height:SL.bottom-SL.title,justifyContent:'center'})}>
              <p style={big(T.chapter,DECK[1].pair.field)}>02</p>
              <Group gap={G.follow}>
                <h1 style={display(INK)}>Our right to win</h1>
                <p style={lead(SECONDARY)}>Why should an owner choose Lumenis?</p>
              </Group>
            </Group>
            <div style={abs({left:SL.bleedA,top:0,width:SL.bleedB,height:SL.H,overflow:'hidden'})}>{photo(70,'45% 50%','A woman in profile, head tilted back, smiling')}</div>
            <Footer at={LEFT} source="" page="12"/>
          </Slide><div className="slide-cap">Chapter break · tracker, chapter number at 220 in the chapter’s field color, then the chapter title at 88 with the question it answers 21 beneath it, in dark grey, centered in the content area; photo full bleed at 38.2%. Photo: brand stock 70.</div></div>

          {/* 3 · Content */}
          <div><Slide>
            <Tracker at={LEFT} chapter={1}/>
            <Column at={LEFT} title="Owners buy certainty, not technology">
              <Group gap={G.section}>
              <p style={lead(INK)}>Every owner asks three questions before signing. We answer all three, together.</p>
              <div style={{display:'flex',flexDirection:'column',gap:G.apart}}>
                {[['01','Proof','Results patients can see, from doctors they trust.'],['02','The menu','Treatments patients ask for by name, priced to pay back.'],['03','A partner that stays','Training, marketing and service long after the install.']].map(([n,h,t])=>(
                  <div key={n} style={{display:'grid',gridTemplateColumns:`${SP[5]}px 1fr`,alignItems:'baseline',rowGap:G.tight}}>
                    <p style={{fontFamily:LIGHT,fontSize:T.lead,lineHeight:1.1,color:DECK[1].pair.ink,margin:0}}>{n}</p>
                    <p style={{fontFamily:SANS,fontSize:T.lead,lineHeight:1.1,color:INK,margin:0}}>{h}</p>
                    <p style={{...body(SECONDARY),gridColumn:2}}>{t}</p>
                  </div>
                ))}
              </div>
              </Group>
            </Column>
            <div style={abs({left:SL.bleedA,top:0,width:SL.bleedB,height:SL.H,overflow:'hidden'})}>{photo(47,'50% 40%','Four women embracing, laughing')}</div>
            <SoWhat at={LEFT} chapter={1}>We win when proof, the menu and the partner arrive together.</SoWhat>
            <Footer at={LEFT} source="Source: what we hear from owners, field themes." page="14"/>
          </Slide><div className="slide-cap">Content · title, then the lead 34 below it, then 55 to three points on one grid: the number in the chapter ink and the point at 36 on one baseline, its supporting line at 28 in dark grey beneath. Photo full bleed at 38.2%; so-what line to close. Photo: brand stock 47.</div></div>

          {/* 4 · Hero number */}
          <div><Slide>
            <div style={abs({left:0,top:0,width:SL.bleedB,height:SL.H,overflow:'hidden'})}>{photo(72,'55% 40%','A woman in warm sunlight, smiling')}</div>
            <Tracker at={RIGHT} chapter={0}/>
            <Column at={RIGHT} title="Sixty years of light">
              <Group gap={G.section}>
              <Group gap={G.follow}>
                <p style={big(T.chapter,INK)}>60</p>
                <p style={lead(INK)}>From the first medical lasers to the treatments patients ask for today.</p>
              </Group>
              <div style={{display:'flex',gap:SP[6]}}>
                <Stat n="1966" l="Founded"/>
                <Stat n="1" l="Partner, first demo to hundredth patient"/>
              </div>
              </Group>
            </Column>
            <Footer at={RIGHT} source="Source: Lumenis, public company history." page="05"/>
          </Slide><div className="slide-cap">Hero number · photo full bleed at 38.2% on the left, so the frame moves to the right-hand column; one figure at 220, one lead line, at most two supporting numbers at 56. Photo: brand stock 72.</div></div>

          {/* 5 · Profile */}
          <div><Slide>
            <div style={abs({left:0,top:0,width:SL.bleedB,height:SL.H,overflow:'hidden'})}>{photo(79,'50% 30%','A woman in a white shirt, arms crossed, smiling')}</div>
            <Tracker at={RIGHT} chapter={0}/>
            <Column at={RIGHT} title={null} gap={G.apart}>
              <Group gap={G.near}>
                <p style={label()}>Med spa owner · illustrative persona</p>
                <h1 style={display(INK)}>Meet Nicole</h1>
              </Group>
              <Group gap={G.section}>
                <p style={lead(INK)}>“I don’t need another device. I need one my patients ask for by name.”</p>
                <div style={{display:'flex',gap:SP[6]}}>
                  <Stat n="2" l="Locations"/>
                  <Stat n="3" l="Devices"/>
                  <Stat n="12" l="Years in practice"/>
                </div>
              </Group>
            </Column>
            <SoWhat at={RIGHT} chapter={0}>Lead with what her patients want.</SoWhat>
            <Footer at={RIGHT} source="Persona built from owner interviews." page="09"/>
          </Slide><div className="slide-cap">Profile · portrait full bleed at 38.2% on the left; everything else on the right-hand column: who she is, her name at 88, her words in serif, her numbers at 56. A persona is labeled as one. Photo: brand stock 79.</div></div>

          {/* 6 · Closing */}
          <div><Slide>
            <div style={abs({left:0,top:0,width:SL.bleedB,height:SL.H,background:BOOKEND.field})}>
              <div style={abs({left:SP[5],top:SP[5]})}><Logo tone="white" width="210px"/></div>
              <Group gap={G.follow} style={abs({left:SP[5],right:SP[5],bottom:SP[5]})}>
                <h1 style={display(WHITE)}>Here’s to their best year</h1>
                <p style={lead(WHITE)}>Thank you.</p>
              </Group>
            </div>
            <div style={abs({left:SL.bleedB,top:0,width:SL.bleedA,height:SL.H,overflow:'hidden'})}>{photo(58,'50% 35%','A woman in profile, eyes closed')}</div>
          </Slide><div className="slide-cap">Closing · mirrors the opening: purple block at 38.2% with the wordmark and the line the room should remember; photo full bleed at 61.8%. Photo: brand stock 58.</div></div>
        </div>

        <h3>Rules</h3>
        <ul className="rules">
          <li><b>One idea per slide.</b> One hero: a number, a photo or one line of display type. About 40 words at most; detail goes in the speaker notes (three bullets: takeaway, key note, why it matters).</li>
          <li><b>Say it once.</b> The tracker names the chapter, the title names the slide. No eyebrows, section labels or captions that repeat either.</li>
          <li><b>Photos bleed.</b> Every photo runs top to bottom and to the slide edge, at 38.2% beside the text column or 61.8% on the bookends. Nothing framed, floating or behind text.</li>
          <li><b>Text stays on its column.</b> Tracker, title, content, so-what and footer all share the text column’s left edge; nothing crosses into the photo.</li>
          <li><b>Space shows what belongs together.</b> A label sits 13 from the text it labels, a completing line 21, a supporting line 8; groups sit 34 apart, and a serif lead line sits 55 above the body it introduces. Never space a label farther from its text than from the next group. Leading stays tight (body 1.32, serif 1.18) so a wrapped line never reads as a new paragraph.</li>
          <li><b>No lines.</b> No hairlines, rules, dividers, borders or boxes. Group with space and type size. The tracker dashes are the only marks.</li>
          <li><b>One footer.</b> Small wordmark, source note and page number on one line, 55 from the bottom, on every content slide. It sits on the text side, left-justified to the text column, so it never touches a photo.</li>
          <li><b>Two text colors.</b> Ink #231F20 for what matters, dark grey #575757 for what supports it. Color only from the chapter’s pairing.</li>
          <li><b>Type sizes never drift.</b> If text doesn’t fit, cut words or split the slide; never shrink the type.</li>
          <li><b>Aspirational photography:</b> warm studio portraits and sunlit people, at ease. People, not devices; never a real attendee as a persona. Source: Lumenis brand stock in HubSpot (Aesthetic - EMEA (DAM) › Brand Visuals › Stock Images › Models).</li>
          <li><b>Sources:</b> every figure carries a source note; label public data and Lumenis data on file separately.</li>
          <li><b>Don’t:</b> dark slides, lines or boxes, framed photos, repeated labels, centered paragraphs, devices as the hero, or claims without clearance.</li>
        </ul>
        <p style={{marginTop:16}}>Where this kit differs from the rest of Lumenis Corporate, it follows the 2027 Aesthetics AOP: letter-spaced labels (Corporate uses 0 tracking), Arizona Mix for whole serif lines (Corporate uses Mix on 1–2 words), and one color pairing per chapter (Corporate shows one secondary color at a time).</p>
      </section>
    </div>
  );
}
