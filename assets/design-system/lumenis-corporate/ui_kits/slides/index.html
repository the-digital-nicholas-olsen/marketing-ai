<!-- @dsCard group="UI Kit — Slides" viewport="1440x900" name="16:9 Slides" subtitle="Slide grid, fixed frame, type scale, rules and six full-bleed slide types, based on the 2027 Aesthetics AOP" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Lumenis — slides</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script src="../../_ds_bundle.js"></script>
<style>
body{background:var(--neutral-200)}
.page{padding:48px;display:flex;flex-direction:column;gap:56px}
.band h2{font-size:14px;text-transform:uppercase;margin-bottom:6px}
.band p{font-size:14px;color:var(--text-secondary);margin-bottom:20px;max-width:820px}
.band h3{font-size:12px;text-transform:uppercase;margin:32px 0 12px;color:var(--text-secondary)}
.row{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start}
.fill{width:100%;height:100%;object-fit:cover;display:block}
.specs{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px 40px;max-width:1400px}
.spec{border-collapse:collapse;width:100%;font-size:13px;line-height:1.35}
.spec th,.spec td{text-align:left;vertical-align:top;padding:7px 0;border-top:1px solid var(--neutral-300)}
.spec th{width:38%;font-weight:400;color:var(--text-secondary);padding-right:16px}
.rules{font-size:13px;line-height:1.45;max-width:1400px;columns:2 440px;column-gap:40px;padding-left:18px}
.rules li{margin-bottom:6px;break-inside:avoid}
.slide-cap{font-size:12px;color:var(--text-secondary);margin-top:8px;max-width:768px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Logo } = window.LumenisCorporateDesignSystem;

/* Photos: Lumenis brand stock photography, hosted in HubSpot
   (Aesthetic - EMEA (DAM) / Marketing Assets / Visuals / Brand Visuals / Stock Images / Models).
   hs-fs serves a resized copy; the originals are 4,000–9,700 px. */
const PHOTO = (n,w=1920) => `https://information.lumenis.com/hs-fs/hubfs/Aesthetic%20-%20EMEA%20(DAM)/Marketing%20Assets/Visuals/Brand%20Visuals/Stock%20Images/Models/Lumenis_Brand%20Stock%20Photography_Models_JPEG%20(${n}).jpg?width=${w}`;
const photo = (n,pos='50% 50%',alt='') => <img className="fill" src={PHOTO(n)} alt={alt} style={{objectPosition:pos}}/>;

/* ── 16:9 slide format ─────────────────────────────────────────────
   Every number below is a slide value (1920×1080 canvas). The system rules
   (golden split, Fibonacci steps, one type scale) live in these tables, so a
   slide never invents its own size. Base point: the 2027 Aesthetics AOP. */
const SL = {
  W:1920, H:1080, M:128,                 // canvas, side margins
  col:973, gap:86,                       // text column (61.8% of the 1664 content width) and its gap to a bleed photo
  bleedA:1187, bleedB:733,               // 61.8 / 38.2 of the full width: photos and color blocks bleed at these widths
  tracker:52, eyebrow:112, title:149,    // fixed frame, measured from the top edge
  top1:266, top2:322, bottom:952,        // content top after a 1- or 2-line title; content bottom
  sowhat:887, foot:32, pageR:48,         // so-what line top; footer offset from the bottom; page number from the right edge
};
const SP = [8,13,21,34,55,89,144];       // the only spacing steps; 55 = title-to-content gap
const T = { label:14, caption:16, body:20, serif:32, number:52, display:84, hero:136,
            trackerLabel:15, eyebrow:22, title:54, chapter:220, foot:14, page:16 };
const INK='#231f20', GREY='#575757', WHITE='#ffffff';
/* Chapter colors (the Accelerate color band): a light field color and a deep ink color per chapter. */
const CH = [
  {name:'Act I',   field:'#6cc39b', ink:'#2f8a68'},
  {name:'Act II',  field:'#7bc9ed', ink:'#316faf'},
  {name:'Act III', field:'#fabcad', ink:'#ba6d81'},
  {name:'Act IV',  field:'#b5a7d1', ink:'#7079ba'},
  {name:'Finale',  field:'#ba6d81', ink:'#8f4d61'},
];
const BOOKEND = '#7079ba';               // opening and closing color block

const SANS="'ABC Arizona Sans', Arial, sans-serif", LIGHT="'ABC Arizona Sans Light', Arial, sans-serif", MIX="'ABC Arizona Mix', Georgia, serif";
const abs=(s)=>({position:'absolute',...s});
const label=(c=INK)=>({fontFamily:SANS,fontSize:T.label,lineHeight:1.3,letterSpacing:3.5,textTransform:'uppercase',color:c});
const display=(c=INK,size=T.display)=>({fontFamily:SANS,fontSize:size,fontWeight:400,lineHeight:.95,textTransform:'uppercase',color:c,margin:0});
const serif=(c=INK)=>({fontFamily:MIX,fontSize:T.serif,lineHeight:1.25,color:c,margin:0});
const body=(c=INK)=>({fontFamily:SANS,fontSize:T.body,lineHeight:1.45,color:c,margin:0});

function Slide({children,scale=0.4}){
  return (
    <div style={{width:SL.W*scale,height:SL.H*scale,overflow:'hidden',boxShadow:'0 10px 30px rgba(0,0,0,.12)',flex:'none'}}>
      <div style={{width:SL.W,height:SL.H,transform:`scale(${scale})`,transformOrigin:'0 0',background:WHITE,position:'relative',color:INK,fontFamily:SANS}}>{children}</div>
    </div>
  );
}
/* Tracker: chapter label, one short dash per chapter in its own color (current one long), then the section. */
function Tracker({chapter,section,width}){
  return (
    <div style={abs({left:SL.M,top:SL.tracker,display:'flex',alignItems:'center',gap:18,maxWidth:width})}>
      <span style={{...label(INK),fontSize:T.trackerLabel,letterSpacing:3,lineHeight:1}}>{CH[chapter].name}</span>
      <span style={{display:'flex',gap:5}}>{CH.map((c,i)=><span key={i} style={{width:i===chapter?28:12,height:4,borderRadius:2,background:c.field}}/>)}</span>
      {section && <span style={{...label(GREY),fontSize:T.trackerLabel,letterSpacing:3,lineHeight:1}}>{section}</span>}
    </div>
  );
}
/* Fixed frame for content slides: tracker, eyebrow, title, source note, page number. */
function Frame({chapter,section,eyebrow,title,width=SL.W-2*SL.M,source,page,pageColor=GREY}){
  return (<>
    <Tracker chapter={chapter} section={section} width={width}/>
    <div style={abs({left:SL.M,top:SL.eyebrow,width,display:'flex',flexDirection:'column',gap:10})}>
      <p style={{fontFamily:SANS,fontSize:T.eyebrow,letterSpacing:4,textTransform:'uppercase',color:GREY,margin:0,lineHeight:1}}>{eyebrow}</p>
      <h2 style={{...display(INK,T.title),lineHeight:1.05}}>{title}</h2>
    </div>
    {source && <p style={abs({left:SL.M,bottom:SL.foot,width,fontFamily:SANS,fontSize:T.foot,lineHeight:1.4,color:GREY,margin:0})}>{source}</p>}
    <p style={abs({right:SL.pageR,bottom:SL.foot,fontFamily:SANS,fontSize:T.page,letterSpacing:1,color:pageColor,margin:0})}>{page}</p>
  </>);
}
/* "So what": the line every content slide ends on. Arrow in the chapter ink, then one serif sentence. */
function SoWhat({chapter,children,width=SL.col}){
  return (
    <div style={abs({left:SL.M,top:SL.sowhat,width,display:'flex',gap:SP[2],alignItems:'baseline'})}>
      <span style={{...serif(CH[chapter].ink),lineHeight:1}}>→</span>
      <p style={{...serif(INK),flex:1}}><b style={{fontWeight:600}}>What it means for us:</b> {children}</p>
    </div>
  );
}
function Spec({rows}){
  return <table className="spec"><tbody>{rows.map(([k,v],i)=><tr key={i}><th>{k}</th><td>{v}</td></tr>)}</tbody></table>;
}

function App(){
  return (
    <div className="page">
      <section className="band">
        <h2>Presentation · 16:9 · 1920 × 1080</h2>
        <p>Based on the 2027 Aesthetics AOP. One idea per slide, on a white ground, with photography that bleeds to the edge of the slide. Every slide uses the same grid, the same fixed frame and the same type sizes, so nothing drifts from page to page. Proportions follow the golden ratio (61.8 / 38.2); spacing uses Fibonacci steps only. No lines, boxes or rules: space, type and photography do the work.</p>

        <h3>Grid and fixed frame</h3>
        <Slide scale={2/3}>
          <div style={abs({left:0,top:0,width:SL.M,height:SL.H,background:'rgba(186,109,129,.10)'})}/>
          <div style={abs({left:SL.M,top:SL.top1,width:SL.col,height:SL.bottom-SL.top1,background:'rgba(97,195,217,.12)',outline:'1px dashed #61c3d9'})}/>
          <div style={abs({left:SL.bleedA,top:0,width:SL.bleedB,height:SL.H,background:'rgba(250,188,173,.35)',outline:'1px dashed #ba6d81'})}/>
          {[[SL.tracker,'52 · tracker'],[SL.eyebrow,'112 · eyebrow 22'],[SL.title,'149 · title 54'],[SL.top1,'266 · content (1-line title)'],[SL.top2,'322 · content (2-line title)'],[SL.sowhat,'887 · so-what line'],[SL.bottom,'952 · content bottom'],[SL.H-SL.foot,'1048 · footer']].map(([y,l])=>(
            <div key={y} style={abs({left:0,width:SL.bleedA,top:y,borderTop:'1px solid rgba(35,31,32,.35)'})}>
              <span style={{position:'absolute',right:SP[2],top:y>900?-30:4,fontSize:22,color:GREY}}>{l}</span>
            </div>
          ))}
          <div style={abs({left:SL.M+SP[2],top:560,fontSize:30,color:'#316faf'})}>Text column · 973 (61.8%)</div>
          <div style={abs({left:SL.M+SL.col+6,top:620,fontSize:22,color:GREY})}>86</div>
          <div style={abs({left:SL.bleedA+SP[4],top:520,width:SL.bleedB-2*SP[4],fontSize:30,color:'#8f4d61'})}>Full-bleed photo · 733 (38.2%), top to bottom and to the edge</div>
          <div style={abs({left:16,top:520,fontSize:22,color:'#8f4d61'})}>128</div>
          <Frame chapter={1} section="02 · Section" eyebrow="Eyebrow · 22px at 112" title="Slide title · 54px caps at 149" width={SL.col} source="Source note · 14px, 32 from the bottom" page="16px" pageColor="#8f4d61"/>
        </Slide>

        <div className="specs" style={{marginTop:24}}>
          <Spec rows={[
            ['Canvas','1920 × 1080 (16:9), white ground'],
            ['Side margins','128 for type'],
            ['Text column','973 (x 128–1101); content from y 266 (1-line title) or 322 (2-line) to 952'],
            ['Photo or color block','Always full bleed: 733 (38.2%) beside a text column, or 1187 (61.8%) on the bookends. Top to bottom, to the slide edge.'],
            ['Spacing steps','8 · 13 · 21 · 34 · 55 · 89 · 144 only'],
            ['Title to content','55, always'],
            ['Bookend inset','89 from the block edges for the wordmark and the headline'],
          ]}/>
          <Spec rows={[
            ['Tracker','Top 52. Chapter name 15px caps, one dash per chapter in its color (current 28 long, others 12), then the section in grey'],
            ['Eyebrow','22px caps at 112, 4px tracking, grey #575757'],
            ['Title','54px caps at 149, Arizona Sans, one or two lines'],
            ['So-what line','Top 887. Arrow in the chapter ink, then one sentence at 32 in Arizona Mix'],
            ['Source note','14px, bottom-left, 32 from the bottom'],
            ['Page number','16px, 48 from the right edge, 32 from the bottom; white when it sits on a photo'],
            ['Logo','White wordmark on the bookend color block only; no logo on content slides'],
          ]}/>
          <Spec rows={[
            ['Label','14 · caps · 3.5px tracking · Arizona Sans'],
            ['Caption','16 · Arizona Sans'],
            ['Body','20 · Arizona Sans, sentence case'],
            ['Serif line, quote, so-what','32 · Arizona Mix'],
            ['Number','52 · Arizona Sans Light'],
            ['Display (name, promise)','84 · caps · Arizona Sans'],
            ['Hero number','136 · Arizona Sans Light; chapter numbers 220'],
          ]}/>
        </div>
        <div className="specs" style={{marginTop:12}}>
          <Spec rows={CH.map(c=>[c.name,<span><span style={{display:'inline-block',width:14,height:14,background:c.field,verticalAlign:-2,marginRight:6}}/>{c.field} field · <span style={{display:'inline-block',width:14,height:14,background:c.ink,verticalAlign:-2,margin:'0 6px'}}/>{c.ink} ink</span>]).concat([['Bookends',<span><span style={{display:'inline-block',width:14,height:14,background:BOOKEND,verticalAlign:-2,marginRight:6}}/>{BOOKEND} block, white type</span>]])}/>
        </div>

        <h3>Slide types</h3>
        <div className="row">
          {/* 1 · Opening */}
          <div><Slide>
            <div style={abs({left:0,top:0,width:SL.bleedA,height:SL.H,overflow:'hidden'})}>{photo(61,'40% 30%','A woman laughing, hands at her cheeks')}</div>
            <div style={abs({left:SL.bleedA,top:0,width:SL.bleedB,height:SL.H,background:BOOKEND})}>
              <div style={abs({left:SP[5],top:SP[5]})}><Logo tone="white" width="210px"/></div>
              <div style={abs({left:SP[5],right:SP[5],bottom:SP[5],display:'flex',flexDirection:'column',gap:SP[3]})}>
                <p style={{...label(WHITE),margin:0}}>2027 · North America Aesthetics</p>
                <h1 style={display(WHITE)}>Every practice. Every patient. Their best year yet.</h1>
                <p style={{...body(WHITE)}}>Month day, year</p>
              </div>
            </div>
          </Slide><div className="slide-cap">Opening · photo full bleed at 61.8%, color block at 38.2% with the white wordmark, a label, the promise at 84 and the date. Photo: brand stock 61.</div></div>

          {/* 2 · Chapter break */}
          <div><Slide>
            <Tracker chapter={1} section="Chapter 02" width={SL.col}/>
            <div style={abs({left:SL.M,top:SL.top1,width:SL.col,height:SL.bottom-SL.top1,display:'flex',flexDirection:'column',justifyContent:'space-between'})}>
              <div style={{display:'flex',flexDirection:'column',gap:SP[3]}}>
                <p style={{...label(GREY),margin:0}}>Act II</p>
                <p style={{fontFamily:LIGHT,fontSize:T.chapter,lineHeight:.8,letterSpacing:-6,color:CH[1].field,margin:0}}>02</p>
                <h1 style={display(INK)}>Our right to win</h1>
                <p style={serif(GREY)}>Why owners choose us, and keep choosing us.</p>
              </div>
              <div style={{display:'flex',gap:SP[3],alignItems:'baseline'}}>
                <p style={{...label(GREY),margin:0,flex:'none'}}>The question</p>
                <p style={serif(INK)}>Why should an owner choose Lumenis?</p>
              </div>
            </div>
            <div style={abs({left:SL.bleedA,top:0,width:SL.bleedB,height:SL.H,overflow:'hidden'})}>{photo(70,'45% 50%','A woman in profile, head tilted back, smiling')}</div>
            <p style={abs({right:SL.pageR,bottom:SL.foot,fontSize:T.page,letterSpacing:1,color:WHITE,margin:0})}>12</p>
          </Slide><div className="slide-cap">Chapter break · tracker, act label, chapter number at 220 in the chapter color, title, promise in serif and the question the chapter answers; photo full bleed at 38.2%. Photo: brand stock 70.</div></div>

          {/* 3 · Content */}
          <div><Slide>
            <Frame chapter={1} section="02 · What owners want" eyebrow="Act II · What owners want" title="Owners buy certainty, not technology" width={SL.col} source="Source: what we hear from owners, field themes." page="14" pageColor={WHITE}/>
            <div style={abs({left:SL.M,top:SL.top2,width:SL.col,display:'flex',flexDirection:'column',gap:SP[4]})}>
              <p style={serif(INK)}>Every owner asks three questions before signing. We answer all three, together.</p>
              {[['01','Proof','Results their patients can see, from doctors they trust.'],['02','The menu','Treatments patients ask for by name, priced to pay back.'],['03','A partner that stays','Training, marketing and service long after the install.']].map(([n,h,t])=>(
                <div key={n} style={{display:'flex',gap:SP[4],alignItems:'baseline'}}>
                  <p style={{fontFamily:LIGHT,fontSize:T.number,lineHeight:1,color:CH[1].ink,margin:0,width:89,flex:'none'}}>{n}</p>
                  <div><p style={{...label(INK),margin:0}}>{h}</p><p style={{...body(INK),marginTop:SP[0]}}>{t}</p></div>
                </div>
              ))}
            </div>
            <div style={abs({left:SL.bleedA,top:0,width:SL.bleedB,height:SL.H,overflow:'hidden'})}>{photo(47,'50% 40%','Four women embracing, laughing')}</div>
            <SoWhat chapter={1}>we win when proof, the menu and the partner arrive together.</SoWhat>
          </Slide><div className="slide-cap">Content · the fixed frame over a 973 text column; numbers in the chapter ink, no lines or boxes; photo full bleed at 38.2%; so-what line to close. Photo: brand stock 47.</div></div>

          {/* 4 · Hero number */}
          <div><Slide>
            <div style={abs({left:0,top:0,width:SL.bleedB,height:SL.H,overflow:'hidden'})}>{photo(72,'55% 40%','A woman in warm sunlight, smiling')}</div>
            <div style={abs({left:SL.bleedB+SL.gap,top:SL.tracker,display:'flex',alignItems:'center',gap:18})}>
              <span style={{...label(INK),fontSize:T.trackerLabel,letterSpacing:3,lineHeight:1}}>{CH[0].name}</span>
              <span style={{display:'flex',gap:5}}>{CH.map((c,i)=><span key={i} style={{width:i===0?28:12,height:4,borderRadius:2,background:c.field}}/>)}</span>
              <span style={{...label(GREY),fontSize:T.trackerLabel,letterSpacing:3,lineHeight:1}}>01 · Who we are</span>
            </div>
            <div style={abs({left:SL.bleedB+SL.gap,top:SL.eyebrow,width:SL.W-SL.bleedB-SL.gap-SL.M,display:'flex',flexDirection:'column',gap:10})}>
              <p style={{fontFamily:SANS,fontSize:T.eyebrow,letterSpacing:4,textTransform:'uppercase',color:GREY,margin:0,lineHeight:1}}>Act I · Who we are</p>
              <h2 style={{...display(INK,T.title),lineHeight:1.05}}>Sixty years of light</h2>
            </div>
            <div style={abs({left:SL.bleedB+SL.gap,top:SL.top1,width:SL.W-SL.bleedB-SL.gap-SL.M,display:'flex',flexDirection:'column',gap:SP[3]})}>
              <p style={{...label(CH[0].ink),margin:0}}>Years of energy-based innovation</p>
              <p style={{fontFamily:LIGHT,fontSize:T.chapter,lineHeight:.85,letterSpacing:-6,color:INK,margin:0}}>60</p>
              <p style={serif(INK)}>From the first medical lasers to the treatments patients ask for today.</p>
              <div style={{display:'flex',gap:SP[5],marginTop:SP[4]}}>
                {[['1966','Founded'],['3','Generations of practices'],['1','Partner, start to finish']].map(([n,l])=>(
                  <div key={l}><p style={{fontFamily:LIGHT,fontSize:T.number,lineHeight:1,margin:0}}>{n}</p><p style={{...label(GREY),marginTop:SP[1]}}>{l}</p></div>
                ))}
              </div>
            </div>
            <p style={abs({left:SL.bleedB+SL.gap,bottom:SL.foot,fontSize:T.foot,color:GREY,margin:0})}>Source: Lumenis, public company history.</p>
            <p style={abs({right:SL.pageR,bottom:SL.foot,fontSize:T.page,letterSpacing:1,color:GREY,margin:0})}>05</p>
          </Slide><div className="slide-cap">Hero number · photo full bleed at 38.2% on the left; the frame moves to the text side; one number at 220, up to three supporting numbers at 52. Photo: brand stock 72.</div></div>

          {/* 5 · Profile */}
          <div><Slide>
            <div style={abs({left:0,top:0,width:SL.bleedB,height:SL.H,overflow:'hidden'})}>{photo(79,'50% 30%','A woman in a white shirt, arms crossed, smiling')}</div>
            <div style={abs({left:SL.bleedB+SL.gap,top:SL.tracker,display:'flex',alignItems:'center',gap:18})}>
              <span style={{...label(INK),fontSize:T.trackerLabel,letterSpacing:3,lineHeight:1}}>{CH[0].name}</span>
              <span style={{display:'flex',gap:5}}>{CH.map((c,i)=><span key={i} style={{width:i===0?28:12,height:4,borderRadius:2,background:c.field}}/>)}</span>
              <span style={{...label(GREY),fontSize:T.trackerLabel,letterSpacing:3,lineHeight:1}}>03 · The owners</span>
            </div>
            <div style={abs({left:SL.bleedB+SL.gap,top:SL.top1-55,width:SL.W-SL.bleedB-SL.gap-SL.M,display:'flex',flexDirection:'column',gap:SP[4]})}>
              <p style={{...label(CH[0].ink),margin:0}}>Med spa owner · illustrative persona</p>
              <h1 style={display(INK)}>Meet Nicole</h1>
              <p style={serif(INK)}>“I don’t need another device. I need one my patients ask for by name.”</p>
              <div style={{display:'flex',gap:SP[5],marginTop:SP[3]}}>
                {[['2','Locations'],['3','Devices on her floor'],['12','Years in practice']].map(([n,l])=>(
                  <div key={l}><p style={{fontFamily:LIGHT,fontSize:T.number,lineHeight:1,margin:0}}>{n}</p><p style={{...label(GREY),marginTop:SP[1]}}>{l}</p></div>
                ))}
              </div>
            </div>
            <SoWhat chapter={0} width={SL.W-SL.bleedB-SL.gap-SL.M}>lead with what her patients want.</SoWhat>
            <p style={abs({right:SL.pageR,bottom:SL.foot,fontSize:T.page,letterSpacing:1,color:GREY,margin:0})}>09</p>
          </Slide><div className="slide-cap">Profile · portrait full bleed at 38.2%; who she is as a label, the name at 84, her words in serif, her numbers at 52. A persona is labeled as one. Photo: brand stock 79.</div></div>

          {/* 6 · Closing */}
          <div><Slide>
            <div style={abs({left:0,top:0,width:SL.bleedB,height:SL.H,background:BOOKEND})}>
              <div style={abs({left:SP[5],top:SP[5]})}><Logo tone="white" width="210px"/></div>
              <div style={abs({left:SP[5],right:SP[5],bottom:SP[5],display:'flex',flexDirection:'column',gap:SP[3]})}>
                <h1 style={display(WHITE)}>Here’s to their best year yet.</h1>
                <p style={serif(WHITE)}>Thank you.</p>
              </div>
            </div>
            <div style={abs({left:SL.bleedB,top:0,width:SL.bleedA,height:SL.H,overflow:'hidden'})}>{photo(58,'50% 35%','Two women cheek to cheek, smiling')}</div>
          </Slide><div className="slide-cap">Closing · mirrors the opening: color block at 38.2% with the wordmark and the line the room should remember; photo full bleed at 61.8%. Photo: brand stock 58.</div></div>
        </div>

        <h3>Rules</h3>
        <ul className="rules">
          <li><b>One idea per slide.</b> One hero: a number, a photo or one line of display type. About 40 words of body at most; detail goes in the speaker notes.</li>
          <li><b>Speaker notes</b> are three short bullets: takeaway, key note, why it matters.</li>
          <li><b>Photos bleed.</b> Every photo runs top to bottom and to the slide edge, at 38.2% beside a text column or 61.8% on the bookends. No framed or floating photos.</li>
          <li><b>No lines.</b> No hairlines, rules, dividers, borders or boxes. Group with space (the Fibonacci steps) and type size. The tracker dashes are the only marks.</li>
          <li><b>Aspirational, not functional.</b> Warm studio portraits and sunlit people, smiling and at ease. People, not devices; never a real attendee as a persona.</li>
          <li><b>Photography source:</b> Lumenis brand stock in HubSpot (Aesthetic - EMEA (DAM) › Brand Visuals › Stock Images › Models). Keep one tone per slide and per spread.</li>
          <li><b>Chapter color:</b> each chapter owns one color pair from the table; the field color for the chapter number and tracker dash, the ink color for small type and the so-what arrow.</li>
          <li><b>Type sizes never drift.</b> Use only the sizes in the tables. If text doesn’t fit, cut words or split the slide; never shrink the type.</li>
          <li><b>Every content slide ends on a so-what line</b> at 887: the arrow, then “What it means for us:” and one sentence.</li>
          <li><b>Sources:</b> every figure carries a source note; label public data and Lumenis data on file separately.</li>
          <li><b>Logo:</b> the white wordmark on the bookend color block only. Content slides carry no logo, brand line or strip.</li>
          <li><b>Don’t:</b> dark slides, lines or boxes, framed photos, centered paragraphs, devices as the hero, or claims without clearance.</li>
        </ul>
        <p style={{marginTop:16}}>Where this kit differs from the rest of Lumenis Corporate, it follows the 2027 Aesthetics AOP: letter-spaced labels and eyebrows (Corporate uses 0 tracking), Arizona Mix for whole serif lines (Corporate uses Mix on 1–2 words), and one color per chapter (Corporate shows one secondary color at a time).</p>
      </section>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
