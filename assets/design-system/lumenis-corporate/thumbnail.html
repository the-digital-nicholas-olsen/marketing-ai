<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>
*{margin:0;box-sizing:border-box}
body{width:1280px;height:854px;display:grid;grid-template-columns:1.35fr 1fr;font-family:var(--font-sans)}
.l{background:var(--lumenis-light-grey);padding:72px;display:flex;flex-direction:column;justify-content:space-between}
.t{font-size:112px;line-height:.9;text-transform:uppercase}
.t img{height:.72em;vertical-align:baseline;margin-right:.02em}
.r{background:var(--lumenis-black);display:flex;align-items:center;justify-content:center;position:relative}
.strip{position:absolute;left:0;right:0;bottom:0;height:22px;display:flex}
.strip div{flex:1}
</style></head>
<body>
<div class="l">
  <div class="t">Unvei<span style="white-space:nowrap">&#8288;<img src="assets/logo/lumenis-hero-l-black.svg" alt="">&#8288;</span>&nbsp;the<br>best in you</div>
  <img src="assets/logo/lumenis-wordmark-black.svg" style="width:360px" alt="Lumenis">
</div>
<div class="r">
  <img src="assets/logo/lumenis-hero-l-white.svg" style="height:360px" alt="">
  <div class="strip"><div style="background:var(--sb-rose-gold)"></div><div style="background:var(--sb-light-purple)"></div><div style="background:var(--sb-blue)"></div><div style="background:var(--sb-turquoise)"></div><div style="background:var(--sb-peach)"></div></div>
</div>
</body></html>
