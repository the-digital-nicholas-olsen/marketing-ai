<!-- @dsCard group="Components" viewport="700x340" name="Form Controls" subtitle="Input, Select, Textarea, Checkbox, Radio" -->
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script src="../../_ds_bundle.js"></script>
<div id="root" style="padding:24px;background:var(--surface-page)"></div>
<script type="text/babel">
const { Input, Select, Textarea, Checkbox, Radio, Button } = window.LumenisCorporateDesignSystem;
function Demo(){
  const [email,setEmail]=React.useState('');
  const [agree,setAgree]=React.useState(true);
  const [market,setMarket]=React.useState('Aesthetics');
  return (
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20}}>
      <Input label="Email" type="email" placeholder="name@clinic.com" value={email} onChange={setEmail}/>
      <Select label="Specialty" placeholder="Select a specialty" options={['Dermatology','Plastic surgery','Ophthalmology','Optometry']}/>
      <Input label="Clinic" variant="underline" placeholder="Clinic name"/>
      <Input label="Phone" error="Enter a valid phone number" value="012-" />
      <Textarea label="Message" rows={2} placeholder="How can we help?"/>
      <div style={{display:'flex',flexDirection:'column',gap:12,justifyContent:'flex-end'}}>
        <div style={{display:'flex',gap:18}}>
          {['Aesthetics','Vision'].map(m=><Radio key={m} label={m} checked={market===m} onChange={()=>setMarket(m)}/>)}
        </div>
        <Checkbox label="I agree to receive Lumenis emails" checked={agree} onChange={setAgree}/>
        <Button type="submit" fullWidth>Sign up</Button>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
