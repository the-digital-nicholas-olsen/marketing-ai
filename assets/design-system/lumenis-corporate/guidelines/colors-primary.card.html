<!-- @dsCard group="Colors" viewport="700x220" name="Primary Palette" subtitle="Black + white system, light grey for photo grounds" -->
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="card.css">
<div style="display:grid;grid-template-columns:1fr 1fr .7fr;height:220px;font-family:var(--font-sans);font-size:12px;line-height:1.45">
  <div style="background:var(--lumenis-white);border-right:1px solid var(--border-subtle);padding:20px;display:flex;flex-direction:column;justify-content:flex-end">
    <div style="text-transform:uppercase;font-size:14px">Lumenis White</div>
    <div class="note">#FFFFFF · RGB 255 255 255<br>CMYK 0 0 0 0 · RAL 9003</div>
  </div>
  <div style="background:var(--lumenis-black);color:var(--lumenis-white);padding:20px;display:flex;flex-direction:column;justify-content:flex-end">
    <div style="text-transform:uppercase;font-size:14px">Lumenis Black</div>
    <div style="color:var(--neutral-400)">#000000 · RGB 0 0 0 · CMYK 50 50 50 100<br>Pantone Black C · RAL 9004</div>
  </div>
  <div style="background:var(--lumenis-light-grey);padding:20px;display:flex;flex-direction:column;justify-content:flex-end">
    <div style="text-transform:uppercase;font-size:14px">Light Grey</div>
    <div class="note">#F2F2F2 · CMYK 5 0 0 0<br>Product &amp; people photo grounds only</div>
  </div>
</div>
