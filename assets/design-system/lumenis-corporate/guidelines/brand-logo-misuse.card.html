<!-- @dsCard group="Brand" viewport="700x260" name="Logotype Misuse" subtitle="Never alter, color, add effects, respace or fill the wordmark" -->
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="card.css">
<style>
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cell{background:var(--lumenis-light-grey);height:74px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.cell img{width:62%}
.lbl{font-size:11px;text-transform:uppercase;color:var(--error);margin-top:5px}
</style>
<div class="card">
  <div class="g">
    <div><div class="cell x"><img src="../assets/logo/lumenis-wordmark-black.svg" style="transform:scaleX(1.35) scaleY(.8)"></div><div class="lbl">Don't alter the shape</div></div>
    <div><div class="cell x"><img src="../assets/logo/lumenis-wordmark-black.svg" style="filter:invert(24%) sepia(96%) saturate(4000%) hue-rotate(330deg)"></div><div class="lbl">Don't color the wordmark</div></div>
    <div><div class="cell x"><img src="../assets/logo/lumenis-wordmark-black.svg" style="filter:drop-shadow(3px 4px 2px rgba(0,0,0,.45))"></div><div class="lbl">Don't add effects</div></div>
    <div><div class="cell x"><span style="font-size:26px;letter-spacing:.35em">LUMENIS</span></div><div class="lbl">Don't modify letter spacing</div></div>
    <div><div class="cell x"><img src="../assets/logo/lumenis-wordmark-black.svg" style="opacity:.35;filter:blur(1px)"></div><div class="lbl">Don't create graphic alterations</div></div>
    <div><div class="cell x"><span style="font-size:34px;background:url(https://information.lumenis.com/hubfs/US%20-%20VIS%20-%20Image%20Catalogue%20-%202026/lumenis-facial-treatment-closeup-001-1280w.webp) center/cover;-webkit-background-clip:text;background-clip:text;color:transparent">LUMENIS</span></div><div class="lbl">Don't fill it with images</div></div>
  </div>
</div>
