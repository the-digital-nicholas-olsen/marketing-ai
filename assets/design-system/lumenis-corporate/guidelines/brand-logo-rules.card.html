<!-- @dsCard group="Brand" viewport="700x260" name="Safety Zone, Size &amp; Trademark" subtitle="Clear space = wordmark height · min 50px / 1.5cm · LUMENIS™" -->
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="card.css">
<div class="card" style="display:grid;grid-template-columns:1.35fr 1fr;gap:28px">
  <div>
    <div class="eyebrow">Safety zone</div>
    <div style="position:relative;display:inline-block;padding:34px;background:repeating-linear-gradient(45deg,var(--neutral-100) 0 6px,var(--lumenis-white) 6px 12px);border:1px dashed var(--neutral-400)">
      <div style="background:var(--lumenis-white);outline:1px solid var(--neutral-300)"><img src="../assets/logo/lumenis-wordmark-black.svg" style="display:block;width:220px;height:auto"></div>
      <span style="position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--text-secondary)">x</span>
      <span style="position:absolute;top:6px;left:50%;font-size:11px;color:var(--text-secondary)">x</span>
    </div>
    <p class="note" style="margin-top:12px">Keep a margin equal to the full height of the wordmark (x) on every side. Nothing enters this space.</p>
  </div>
  <div class="col" style="gap:20px">
    <div>
      <div class="eyebrow">Minimum size</div>
      <div class="row" style="align-items:flex-end;gap:22px">
        <div><img src="../assets/logo/lumenis-wordmark-black.svg" style="width:50px;display:block"><div class="note" style="margin-top:6px">50px digital</div></div>
        <div><img src="../assets/logo/lumenis-wordmark-black.svg" style="width:57px;display:block"><div class="note" style="margin-top:6px">1.5cm print</div></div>
      </div>
    </div>
    <div>
      <div class="eyebrow">Trademark</div>
      <div style="font-size:28px;line-height:1">LUMENIS<sup style="font-size:.4em">™</sup></div>
      <p class="note" style="margin-top:8px">Superscript ™ immediately after the mark — LUMENIS™ / Lumenis™ in running copy.</p>
    </div>
  </div>
</div>
