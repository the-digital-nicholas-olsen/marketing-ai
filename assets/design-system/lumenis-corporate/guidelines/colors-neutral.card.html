<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals &amp; Semantic" subtitle="Derived UI greys, text, borders, states" -->
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="card.css">
<div style="display:flex;height:100px;font-family:var(--font-sans);font-size:11px">
  <div style="flex:1;background:var(--neutral-50);display:flex;align-items:flex-end;padding:6px">50</div>
  <div style="flex:1;background:var(--neutral-100);display:flex;align-items:flex-end;padding:6px">100</div>
  <div style="flex:1;background:var(--neutral-200);display:flex;align-items:flex-end;padding:6px">200</div>
  <div style="flex:1;background:var(--neutral-300);display:flex;align-items:flex-end;padding:6px">300</div>
  <div style="flex:1;background:var(--neutral-400);display:flex;align-items:flex-end;padding:6px">400</div>
  <div style="flex:1;background:var(--neutral-500);color:#fff;display:flex;align-items:flex-end;padding:6px">500</div>
  <div style="flex:1;background:var(--neutral-600);color:#fff;display:flex;align-items:flex-end;padding:6px">600</div>
  <div style="flex:1;background:var(--neutral-700);color:#fff;display:flex;align-items:flex-end;padding:6px">700</div>
  <div style="flex:1;background:var(--neutral-800);color:#fff;display:flex;align-items:flex-end;padding:6px">800</div>
  <div style="flex:1;background:var(--neutral-900);color:#fff;display:flex;align-items:flex-end;padding:6px">900</div>
</div>
<div style="display:flex;gap:22px;padding:14px 16px;font-family:var(--font-sans);font-size:12px;align-items:center">
  <span>Text primary <b style="font-weight:400">#000</b></span>
  <span style="color:var(--text-secondary)">Secondary #575757</span>
  <span style="color:var(--text-tertiary)">Tertiary #7A7A7A</span>
  <span style="color:var(--success)">Success</span>
  <span style="color:var(--error)">Error</span>
  <span class="note">Greys are UI derivations, not printed brand colors.</span>
</div>
