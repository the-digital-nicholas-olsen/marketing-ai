<!-- @dsCard group="Spacing" viewport="700x220" name="Corners, Elevation &amp; CTA Clear Space" subtitle="Square by default · soft shadow only for floating cards" -->
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="card.css">
<div class="card" style="display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:24px;background:var(--lumenis-light-grey);height:220px">
  <div class="col"><div class="eyebrow">Radius 0 · default</div><div style="height:90px;background:#fff;border:1px solid var(--border-subtle)"></div><span class="note">Blocks, cards, buttons, fields.</span></div>
  <div class="col"><div class="eyebrow">Shadow soft</div><div style="height:90px;background:#fff;box-shadow:var(--shadow-soft)"></div><span class="note">A card floating over a color block.</span></div>
  <div class="col"><div class="eyebrow">CTA spacing</div>
    <div style="background:#fff;padding:14px">
      <div class="t" style="font-size:22px">Unvei<span style="white-space:nowrap">&#8288;<img class="hl" src="../assets/logo/lumenis-hero-l-black.svg">&#8288;</span> the best<br>in you.</div>
      <div style="height:34px;border-left:1px dashed var(--error);margin-left:8px;position:relative"><span style="position:absolute;left:8px;top:10px;font-size:10px;color:var(--error)">≥ 1 button height</span></div>
      <span style="display:inline-block;background:#000;color:#fff;font-size:13px;line-height:1;padding:10px 16px;text-transform:uppercase">Discover more</span>
    </div>
  </div>
</div>
